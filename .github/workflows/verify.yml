name: Verify archived SeDPO experiment
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reproduce.py check-source
      - run: python reproduce.py verify
      - run: python -m unittest discover -s repro -p 'test_*.py' -v
      - run: bash -n env/setup_tablei.sh
